<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VOID 001 // XAVEVR DELIVERY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #050505;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 720px;
      border: 1px solid #242424;
      background: #080808;
      padding: 42px;
      position: relative;
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 3px,
          rgba(255,255,255,0.018) 4px
        );
    }

    .status {
      font-size: 11px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 35px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(42px, 9vw, 82px);
      line-height: .85;
      letter-spacing: -4px;
      margin: 0 0 20px;
      font-weight: 900;
    }

    .sub {
      color: #888;
      font-size: 13px;
      letter-spacing: 1px;
      line-height: 1.7;
      max-width: 500px;
    }

    .signal {
      margin-top: 40px;
      height: 1px;
      width: 100%;
      background: #242424;
      position: relative;
      overflow: hidden;
    }

    .signal::after {
      content: "";
      position: absolute;
      width: 30%;
      height: 100%;
      background: #fff;
      animation: scan 2s linear infinite;
    }

    .download {
      display: none;
      margin-top: 40px;
    }

    .download a {
      display: inline-block;
      padding: 16px 24px;
      border: 1px solid #444;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: .2s;
    }

    .download a:hover {
      background: #fff;
      color: #000;
    }

    .error {
      display: none;
      margin-top: 35px;
      border: 1px solid #3a2020;
      padding: 18px;
      color: #c77;
      font-size: 12px;
      line-height: 1.6;
    }

    .success {
      display: none;
      margin-top: 35px;
      color: #aaa;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @keyframes scan {
      from {
        transform: translateX(-120%);
      }

      to {
        transform: translateX(400%);
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="status">
      XAVEVR // SECURE DELIVERY
    </div>

    <h1>VOID 001</h1>

    <div class="sub" id="message">
      VERIFYING PAYMENT SIGNAL...
    </div>

    <div class="signal"></div>

    <div class="success" id="success">
      PAYMENT VERIFIED // ACCESS GRANTED
    </div>

    <div class="download" id="download">
      <a id="downloadLink" href="#">
        DOWNLOAD VOID 001
      </a>
    </div>

    <div class="error" id="error">
      DELIVERY FAILED.<br><br>
      Your payment could not be verified or the download session
      is invalid or expired.
    </div>

  </main>

  <script>
    const WORKER_URL =
      "https://xavevr-delivery.xavevr0.workers.dev";

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");

    const message = document.getElementById("message");
    const success = document.getElementById("success");
    const download = document.getElementById("download");
    const downloadLink = document.getElementById("downloadLink");
    const error = document.getElementById("error");

    async function verifyPayment() {

      if (!sessionId) {
        message.textContent = "NO PAYMENT SESSION DETECTED.";
        error.style.display = "block";
        return;
      }

      try {

        const downloadUrl =
          WORKER_URL +
          "/download?session_id=" +
          encodeURIComponent(sessionId);

        const response = await fetch(downloadUrl);

        if (!response.ok) {
          throw new Error("Payment verification failed.");
        }

        message.textContent =
          "PAYMENT VERIFIED. YOUR PRODUCT IS READY.";

        success.style.display = "block";
        download.style.display = "block";

        downloadLink.href = downloadUrl;

      } catch (err) {

        console.error(err);

        message.textContent =
          "UNABLE TO VERIFY PAYMENT.";

        error.style.display = "block";
      }
    }

    verifyPayment();
  </script>

</body>
</html>
